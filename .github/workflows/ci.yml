name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npx prisma generate
        working-directory: apps/cms
      - run: npx next typegen
        working-directory: apps/cms
      - run: npx next typegen
        working-directory: apps/my-portfolio
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  e2e:
    # Pinned, not ubuntu-latest: visual baselines are pixel-exact, and a
    # runner image bump can change font rendering under them.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: custom_cms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/custom_cms_test"
      AUTH_SECRET: "ci-test-secret-do-not-use-in-prod"
      NEXTAUTH_URL: "http://localhost:4001"
      # Throwaway: the database is a service container destroyed after the run.
      SEED_USER_PASSWORD: "ci-e2e-seed-password"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npx prisma generate
        working-directory: apps/cms
      - run: npx prisma migrate deploy
        working-directory: apps/cms
      # Before seeding, so the visual specs still see seed-only data.
      - run: npm run test:int
        working-directory: apps/cms
      - run: npm run db:seed
        working-directory: apps/cms
      - run: npx playwright install --with-deps chromium
        working-directory: apps/cms
      - run: npm run build
        working-directory: apps/cms
      # Visual first, while the database still holds only seed data.
      - id: visual
        run: npm run e2e:visual
        working-directory: apps/cms
      # On a visual failure, regenerate the baselines (still against
      # seed-only data, visual specs don't write) and upload them, so
      # new/changed PNGs can be reviewed and committed - see
      # docs/E2E_TESTING_PLAN.md §4.
      - if: failure() && steps.visual.outcome == 'failure'
        run: npm run e2e:visual -- --update-snapshots=changed
        working-directory: apps/cms
      - if: failure() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/cms/e2e/visual/*-snapshots/
          if-no-files-found: ignore
      - if: ${{ !cancelled() && steps.visual.outcome != 'skipped' }}
        run: npm run e2e
        working-directory: apps/cms
